server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Serve static exports that are emitted as <route>.html (e.g. /login)
        # while still serving real directories such as /_next and /.
        try_files $uri $uri.html $uri/ =404;
    }
}
